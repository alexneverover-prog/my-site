<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мой тестовый сайт</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f8fb;
      color: #222;
    }
    .wrap {
      max-width: 900px;
      margin: 80px auto;
      padding: 40px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 42px;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 24px;
      border-radius: 12px;
      background: #111827;
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Привет! Это мой первый сайт</h1>
    <p>Я создала этот тестовый файл, чтобы попробовать VS Code и GitHub.</p>
    <p>Дальше сюда можно добавить текст, картинки, кнопки и целые разделы сайта.</p>
    <a class="btn" href="#">Кнопка для примера</a>
  </div>
</body>
</html>
